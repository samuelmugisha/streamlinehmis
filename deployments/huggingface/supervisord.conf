[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:hasura]
command=/usr/local/bin/graphql-engine serve
stdout_logfile=/tmp/hasura.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true
autorestart=true

[program:mock-his]
command=/usr/local/bin/python app.py
directory=/app/mock-his
environment=PORT="9000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true

[program:fabric]
command=/usr/local/bin/python -m uvicorn main:app --app-dir src --host 127.0.0.1 --port 8001
directory=/app/fabric
environment=EHR_FHIR_BASE_URL="http://127.0.0.1:9000/fhir",FINANCIAL_API_BASE_URL="http://127.0.0.1:9000/api/financial",FHIR_BASE_URL="http://127.0.0.1:8001/fhir",KAFKA_BOOTSTRAP_SERVERS="",INTEGRATION_MODE="change_api",EHR_SOURCE="hospilot"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true

[program:backend]
; waits for start.sh to finish applying Hasura metadata before booting
command=/bin/sh -c 'while [ ! -f /tmp/hasura-ready ]; do sleep 1; done; exec /usr/local/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000'
directory=/app/agentic-framework
environment=PYTHONPATH="/app/agentic-framework"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -e /dev/stderr -c /app/hf/nginx.conf -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
